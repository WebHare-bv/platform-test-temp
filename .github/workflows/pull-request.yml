# Run the 'pull' step for external pull requests. If we try this inside ci.yml we ended up with dozens of skipped dupe jobs
name: External Pull Request CI

on:
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    if: github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/ci.yml
